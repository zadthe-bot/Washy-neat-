name: Bootstrap Android Gradle Project

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'android/**'
      - '.github/workflows/**'

jobs:
  bootstrap:
    name: Automated Android/Gradle project bootstrapping
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Bootstrap Capacitor Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Ensure Gradlew Executable
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Commit and Push Bootstrapped Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add android/ .github/
          if git diff --staged --quiet; then
            echo "No bootstrapping changes to commit."
          else
            git commit -m "chore: automated Android/Gradle project bootstrapping"
            git push
          fi
