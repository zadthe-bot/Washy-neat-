name: Create Android Signing Key

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signing-key:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Create signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -f "urbanwash-release.keystore" ]; then
            echo "Keystore already exists. Reusing it."
          else
            echo "Creating new Android release keystore..."

            keytool -genkeypair \
              -v \
              -keystore urbanwash-release.keystore \
              -alias urbanwash \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEYSTORE_PASSWORD" \
              -dname "CN=Urban Wash,O=Urban Wash,C=TZ"

            echo "Keystore created successfully."
          fi

      - name: Print SHA-1 and SHA-256
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo ""
          echo "=============================================="
          echo "        URBAN WASH ANDROID FINGERPRINTS"
          echo "=============================================="
          echo ""

          keytool -list \
            -v \
            -keystore urbanwash-release.keystore \
            -alias urbanwash \
            -storepass "$KEYSTORE_PASSWORD" \
            | grep -E "SHA1:|SHA256:"

          echo ""
          echo "=============================================="
          echo "IMPORTANT:"
          echo "Add BOTH fingerprints to Firebase."
          echo "=============================================="

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: urbanwash-release-keystore
          path: urbanwash-release.keystore
          retention-days: 7
