name: Create WashyNeat Android Signing Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing-key:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Create WashyNeat signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -f "washyneat-release.keystore" ]; then
            echo "Keystore already exists. Reusing it."
          else
            echo "Creating WashyNeat release keystore..."

            keytool -genkeypair \
              -v \
              -keystore washyneat-release.keystore \
              -alias washyneat \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEYSTORE_PASSWORD" \
              -dname "CN=WashyNeat,O=WashyNeat,C=TZ"

            echo "Keystore created successfully."
          fi

      - name: Print SHA fingerprints
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo ""
          echo "=============================================="
          echo "       WASHYNEAT ANDROID FINGERPRINTS"
          echo "       PACKAGE: com.washyneat.app"
          echo "=============================================="
          echo ""

          keytool -list \
            -v \
            -keystore washyneat-release.keystore \
            -alias washyneat \
            -storepass "$KEYSTORE_PASSWORD" \
            | grep -E "SHA1:|SHA256:"

          echo ""
          echo "=============================================="
          echo "Add BOTH fingerprints to Firebase."
          echo "=============================================="

      - name: Upload WashyNeat keystore
        uses: actions/upload-artifact@v4
        with:
          name: washyneat-release-keystore
          path: washyneat-release.keystore
          retention-days: 7
