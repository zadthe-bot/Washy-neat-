name: Build Washy Neat Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android || true

      - name: Ensure Google Services Plugin in Gradle
        run: |
          if [ -f "android/build.gradle" ]; then
            if ! grep -q "com.google.gms.google-services" android/build.gradle; then
              echo "Adding google-services plugin to android/build.gradle"
              cat << 'EOF' >> android/build.gradle

plugins {
    id 'com.google.gms.google-services' version '4.5.0' apply false
}
EOF
            fi
          fi
          if [ -f "android/app/build.gradle" ]; then
            if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
              echo "Adding google-services plugin to android/app/build.gradle"
              sed -i "/id 'com.android.application'/a \    id 'com.google.gms.google-services'" android/app/build.gradle || true
            fi
          fi

      - name: Make Gradlew Executable
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WashyNeat-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
