name: Build Washy Neat Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android || true

      - name: Make Gradlew Executable and Ensure Config
        run: |
          cd android
          if [ ! -f "app/google-services.json" ] || [ ! -s "app/google-services.json" ] || [ "$(cat app/google-services.json)" = "{}" ]; then
            echo "Creating default google-services.json for com.washyneat.app..."
            cat << 'EOF' > app/google-services.json
{
  "project_info": {
    "project_number": "123456789012",
    "project_id": "washy-neat-app",
    "storage_bucket": "washy-neat-app.appspot.com"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890",
        "android_client_info": {
          "package_name": "com.washyneat.app"
        }
      },
      "oauth_client": [],
      "api_key": [
        {
          "current_key": "AIzaSyDummyApiKeyForBuildPurposeOnly12345"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": []
        }
      }
    }
  ],
  "configuration_version": "1"
}
EOF
          fi
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ] || ! java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -v >/dev/null 2>&1; then
            echo "Gradle wrapper JAR is missing or corrupted. Regenerating using gradle CLI..."
            gradle wrapper --gradle-version 8.2.1
          fi
          chmod +x gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WashyNeat-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
