name: Generate and Commit Android Gradle Files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-android:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Node.js 22
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # 4. Build React/Vite application
      - name: Build web app
        run: npm run build

      # 5. Generate Android project
      - name: Generate Android project
        run: |
          if [ -f "android/gradlew" ]; then
            echo "Complete Android project already exists."
          else
            echo "Android Gradle project is missing or incomplete."

            if [ -d "android" ]; then
              echo "Removing incomplete Android folder..."
              rm -rf android
            fi

            echo "Generating Android project..."
            npx cap add android
          fi

      # 6. Verify Gradle wrapper
      - name: Verify Gradle wrapper
        run: |
          echo "Checking Android Gradle files..."

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: android/gradlew was not generated."
            echo "Contents of android folder:"
            ls -la android || true
            exit 1
          fi

          if [ ! -f "android/build.gradle" ]; then
            echo "ERROR: android/build.gradle is missing."
            exit 1
          fi

          if [ ! -f "android/app/build.gradle" ]; then
            echo "ERROR: android/app/build.gradle is missing."
            exit 1
          fi

          if [ ! -f "android/settings.gradle" ]; then
            echo "ERROR: android/settings.gradle is missing."
            exit 1
          fi

          echo "All required Gradle files exist."

      # 7. Make Gradle executable
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # 8. Sync Capacitor
      - name: Sync Capacitor
        run: npx cap sync android

      # 9. Check generated Android project
      - name: List Android project
        run: |
          echo "Android project:"
          find android -maxdepth 2 -type f | sort

      # 10. Commit Android project
      - name: Commit Android project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add android

          if git diff --cached --quiet; then
            echo "No Android changes to commit."
          else
            git commit -m "Generate Android Gradle project"
            git push
          fi
